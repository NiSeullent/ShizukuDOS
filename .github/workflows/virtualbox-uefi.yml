name: Actual VirtualBox 7 EFI32 and EFI64 regression
on:
  workflow_dispatch:
    inputs:
      iso_source:
        description: Test the exact successful candidate artifact, published asset, or fresh build
        required: true
        default: artifact
        type: choice
        options: [artifact, published, build]
      candidate_run_id:
        description: Successful dos-iso.yml run ID when iso_source is artifact
        required: false
        default: ''
        type: string
      release_tag:
        description: Published release tag when iso_source is published
        required: true
        default: dos-v10.0.1
        type: string
permissions:
  contents: read
  actions: read
jobs:
  virtualbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ISO_SOURCE: ${{ inputs.iso_source }}
      TEST_RELEASE_TAG: ${{ inputs.release_tag }}
      TEST_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
      # Only this disposable runner installs host packages/drivers. The Python
      # harness never installs drivers or changes an existing local host.
      # Official package/driver requirements:
      # https://docs.oracle.com/en/virtualization/virtualbox/7.0/user/installation.html
      - name: Install VirtualBox 7 and matching disposable-runner host modules
        id: virtualbox_setup
        continue-on-error: true
        run: |
          test "$GITHUB_ACTIONS" = true
          mkdir -p build/virtualbox-tests
          sudo apt-get update
          sudo apt-get install -y build-essential dkms "linux-headers-$(uname -r)" virtualbox virtualbox-dkms
          sudo modprobe vboxdrv
          VBoxManage --version
      - name: Fall back to checksum-pinned official Oracle VirtualBox 7.2 on newer runner kernels
        if: steps.virtualbox_setup.outcome == 'failure'
        id: oracle_virtualbox_setup
        continue-on-error: true
        run: |
          test "$GITHUB_ACTIONS" = true
          mkdir -p build/virtualbox-tests
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base = 'https://download.virtualbox.org/virtualbox/7.2.20/'
          name = 'virtualbox-7.2_7.2.20-175154~Ubuntu~noble_amd64.deb'
          expected = 'be6001acc99dacc7a199ddd142c23550ed3e3fa9b04cfc98f608e39433c44c81'
          with urllib.request.urlopen(base + 'SHA256SUMS', timeout=30) as reply:
              checksums = reply.read().decode('ascii')
          if expected + ' *' + name not in checksums.splitlines():
              raise SystemExit('Official Oracle checksum list does not match pinned package')
          output = Path('build') / name
          hasher = hashlib.sha256()
          with urllib.request.urlopen(base + name, timeout=60) as reply, output.open('wb') as target:
              while data := reply.read(1 << 20):
                  target.write(data); hasher.update(data)
          if hasher.hexdigest() != expected:
              raise SystemExit('Official Oracle VirtualBox package SHA-256 mismatch')
          Path('build/virtualbox-tests/host-package.json').write_text(json.dumps({'source': base + name, 'version': '7.2.20', 'sha256': expected, 'checksum_source': base + 'SHA256SUMS', 'reason': 'distribution package/module setup failed'}, indent=2) + '\n')
          PY
          sudo apt-get install -y build-essential dkms "linux-headers-$(uname -r)"
          # This job owns the disposable host. No developer workstation is changed.
          sudo apt-get remove -y virtualbox virtualbox-dkms virtualbox-qt
          sudo apt-get install -y "$PWD/build/virtualbox-7.2_7.2.20-175154~Ubuntu~noble_amd64.deb"
          if test -x /sbin/rcvboxdrv; then
            sudo /sbin/rcvboxdrv setup
          else
            sudo /sbin/vboxconfig
          fi
          sudo modprobe vboxdrv
          VBoxManage --version
      - name: Prepare disposable host for actual VirtualBox execution
        id: virtualbox_host_setup
        continue-on-error: true
        run: |
          test "$GITHUB_ACTIONS" = true
          lsmod | tee build/virtualbox-tests/host-modules-before.txt
          ls -l /dev/vboxdrv | tee build/virtualbox-tests/host-device-before.txt
          sudo chmod a+rw /dev/vboxdrv
          # Recent Linux KVM may reserve VT-x on module load. No other guest is
          # running in this disposable job; release vendor backends if possible.
          # Failure remains diagnostic: the actual VM launch must determine
          # whether VT-x/AMD-V is available. Never stop unrelated host processes.
          for module in kvm_intel kvm_amd; do
            if lsmod | awk -v name="$module" '$1==name{found=1} END{exit !found}'; then
              if ! sudo modprobe -r "$module"; then
                echo "::warning::Could not unload $module; actual VM launch will check virtualization availability"
              fi
            fi
          done
          # Oracle documents unloading the vendor module as sufficient. The
          # base kvm module may legitimately remain in use on the hosted runner.
          if lsmod | awk '$1=="kvm"{found=1} END{exit !found}'; then
            if ! sudo modprobe -r kvm; then
              echo '::warning::Base kvm remains loaded; this is diagnostic, not a guest boot result'
            fi
          fi
          lsmod | tee build/virtualbox-tests/host-modules-after.txt
          ls -l /dev/vboxdrv | tee build/virtualbox-tests/host-device-after.txt
          VBoxManage --version
      - name: Record actual host capability
        id: host_capability
        continue-on-error: true
        run: |
          python3 -B tools/test_virtualbox.py --probe-only
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('build/virtualbox-tests/result.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(result['host']['status'] == 'AVAILABLE').lower() + '\n')
          PY
      - name: Install offline ISO build tools on disposable runner
        if: steps.host_capability.outputs.available == 'true' && inputs.iso_source == 'build'
        run: |
          sudo apt-get install -y nasm gcc gcc-multilib binutils gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 xorriso mtools
      - name: Build the genuine default distribution ISO
        if: steps.host_capability.outputs.available == 'true' && inputs.iso_source == 'build'
        run: python3 -B tools/build_iso.py
      - name: Download and verify the exact successful candidate ISO artifact
        if: steps.host_capability.outputs.available == 'true' && inputs.iso_source == 'artifact'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          run_id = os.environ['TEST_CANDIDATE_RUN_ID']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('artifact input requires an explicit successful candidate_run_id')
          reply = subprocess.run(['gh', 'api', 'repos/' + repository + '/actions/runs/' + run_id], check=True, capture_output=True, text=True)
          run = json.loads(reply.stdout)
          if (run['status'] != 'completed' or run['conclusion'] != 'success'
                  or run['path'].split('@', 1)[0] != '.github/workflows/dos-iso.yml'
                  or run['head_repository']['full_name'] != repository):
              raise SystemExit('Expected a successful same-repository dos-iso.yml candidate run')
          folder = Path('build/candidate-input')
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', repository, '--name', 'shizukudos-10-dos-only', '--dir', str(folder)], check=True)
          manifests = list(folder.rglob('shizukudos-*-manifest.json'))
          receipts = [path for path in folder.rglob('build-result.json') if path.parent.name == 'iso']
          if len(manifests) != 1 or len(receipts) != 1:
              raise SystemExit('Candidate artifact must contain one release manifest and ISO build receipt')
          manifest = json.loads(manifests[0].read_text())
          receipt = json.loads(receipts[0].read_text())
          if manifest['source_commit'] != run['head_sha'] or manifest['iso_acceptance']['status'] != 'PASS':
              raise SystemExit('Candidate source commit or ISO acceptance does not match successful run')
          assets = [(name, info) for name, info in manifest['assets'].items() if name.endswith('-dos-only.iso')]
          if len(assets) != 1:
              raise SystemExit('Expected one release ISO manifest entry')
          name, info = assets[0]
          files = [path for path in folder.rglob('*.iso') if path.name == name]
          expected = info['sha256']
          if len(files) != 1 or not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('Expected the exact candidate release ISO file and SHA-256')
          source = files[0]
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          if (actual != expected or source.stat().st_size != info['bytes']
                  or manifest['iso_acceptance']['sha256'] != actual
                  or receipt['sha256'] != actual or receipt['bytes'] != source.stat().st_size):
              raise SystemExit('Candidate ISO byte/hash mismatch against manifest or build receipt')
          output = Path('build/shizukudos-10-dos-only.iso')
          shutil.copyfile(source, output)
          Path('build/virtualbox-tests/candidate-input.json').write_text(json.dumps({'run_id': run_id, 'run_url': run['html_url'], 'source_commit': run['head_sha'], 'tester_commit': os.environ['GITHUB_SHA'], 'asset': name, 'sha256': actual, 'bytes': source.stat().st_size, 'manifest': str(manifests[0]), 'release_state': manifest.get('release_state', 'release')}, indent=2) + '\n')
          print('Testing exact candidate ISO ' + name + ' SHA-256 ' + actual)
          PY
      - name: Download and verify exact published ISO asset
        if: steps.host_capability.outputs.available == 'true' && inputs.iso_source == 'published'
        run: |
          mkdir -p build
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          tag = os.environ['TEST_RELEASE_TAG']
          if not re.fullmatch(r'dos-v[0-9][0-9A-Za-z.-]*', tag):
              raise SystemExit('Invalid release tag')
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(base + '/releases/tags/' + tag, headers=headers), timeout=30) as reply:
              release = json.load(reply)
          assets = [a for a in release['assets'] if a['name'].endswith('-dos-only.iso')]
          if release['draft'] or len(assets) != 1:
              raise SystemExit('Expected one published DOS-only ISO')
          asset = assets[0]
          expected = asset.get('digest', '').removeprefix('sha256:')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('GitHub did not supply an authoritative asset SHA-256')
          output = Path('build/shizukudos-10-dos-only.iso')
          hasher = hashlib.sha256()
          with urllib.request.urlopen(asset['browser_download_url'], timeout=60) as reply, output.open('wb') as target:
              while data := reply.read(1 << 20):
                  target.write(data); hasher.update(data)
          if hasher.hexdigest() != expected or output.stat().st_size != asset['size']:
              raise SystemExit('Published ISO size/hash mismatch')
          Path('build/virtualbox-tests/published-input.json').write_text(json.dumps({'tag': tag, 'release_url': release['html_url'], 'asset': asset['name'], 'sha256': expected}, indent=2) + '\n')
          PY
      - name: Boot actual VirtualBox EFI64 and EFI32 from the same ISO
        if: steps.host_capability.outputs.available == 'true'
        run: python3 -B tools/test_virtualbox.py --firmware all --timeout 240
      - name: Fail clearly when actual VirtualBox cannot run
        if: always() && steps.host_capability.outputs.available != 'true'
        run: |
          cat build/virtualbox-tests/result.json
          echo 'Actual VirtualBox regression is UNAVAILABLE on this host. This is not a boot PASS.'
          exit 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shizukudos-virtualbox-efi32-efi64
          if-no-files-found: error
          path: |
            build/virtualbox-tests/result.json
            build/virtualbox-tests/published-input.json
            build/virtualbox-tests/candidate-input.json
            build/virtualbox-tests/host-package.json
            build/virtualbox-tests/host-modules-*.txt
            build/virtualbox-tests/host-device-*.txt
            build/virtualbox-tests/*/result.json
            build/virtualbox-tests/*/serial.log
            build/virtualbox-tests/*/commands.jsonl
            build/virtualbox-tests/*/VBox.log*
            build/virtualbox-tests/*/*.png
